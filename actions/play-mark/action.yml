name: Play mark
description: Records a release as sent to Google Play, so play-gate skips it on the next run.

inputs:
  tag:
    description: The release tag that reached Google Play.
    required: true

runs:
  using: composite
  steps:
    # play-gate looks the marker up with gzip on any runner, so this side packs with gzip too.
    - shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        dir="$RUNNER_TEMP/no-zstd"
        mkdir -p "$dir" play-sent
        printf '#!/bin/sh\nexit 1\n' > "$dir/zstd"
        chmod +x "$dir/zstd"
        printf '@exit /b 1\r\n' > "$dir/zstd.cmd"
        echo "$dir" >> "$GITHUB_PATH"
        echo "$TAG" > play-sent/tag
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: play-sent
        key: play-sent-${{ inputs.tag }}
        enableCrossOsArchive: true
