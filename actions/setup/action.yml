name: Setup
description: Installs the tools pinned in mise.toml and the pnpm dependencies from the lockfile.

inputs:
  install_args:
    description: Tools for mise to install, such as "node pnpm". Empty installs each tool in mise.toml.
    default: ""
  pnpm-install:
    description: Set to "false" to skip pnpm install.
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        # The tools stay on the dev machine between runs. A cache would upload them to GitHub on each run.
        cache: false
        install_args: ${{ inputs.install_args }}
    - if: inputs.pnpm-install == 'true'
      shell: bash
      run: mise x -- pnpm install --frozen-lockfile
