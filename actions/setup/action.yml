name: Setup
description: Installs the tools pinned in mise.toml and the pnpm dependencies from the lockfile.

inputs:
  install_args:
    description: Tools for mise to install, such as "node pnpm". Empty installs each tool in mise.toml.
    default: ""
  pnpm-install:
    description: Set to "false" to skip pnpm install.
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      env:
        # A running tool can keep the machine-wide uvx shim open on self-hosted runners.
        MISE_SHIMS_DIR: ${{ runner.temp }}/mise-shims
      with:
        # The tools stay on the dev machine between runs. A cache would upload them to GitHub on each run.
        cache: false
        # The shared Windows machine runs many independent runner services.
        # Install tools below under a machine-wide mutex rather than racing on the shared mise directory.
        install: false
    - name: Install mise tools without concurrent filesystem writes
      shell: pwsh
      env:
        MISE_INSTALL_ARGS: ${{ inputs.install_args }}
      run: |
        $mutexName = if ([System.OperatingSystem]::IsWindows()) { 'Global\WorkbenchSoftMiseInstall' } else { 'WorkbenchSoftMiseInstall' }
        $mutex = [System.Threading.Mutex]::new($false, $mutexName)
        $acquired = $false
        try {
          try { $acquired = $mutex.WaitOne([TimeSpan]::FromMinutes(30)) }
          catch [System.Threading.AbandonedMutexException] { $acquired = $true }
          if (-not $acquired) { throw 'Timed out waiting for the shared mise installation lock' }
          $arguments = @('install')
          if ($env:MISE_INSTALL_ARGS.Trim()) {
            $arguments += $env:MISE_INSTALL_ARGS.Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          }
          & mise @arguments
          if ($LASTEXITCODE -ne 0) { throw "mise install failed with exit code $LASTEXITCODE" }
        } finally {
          if ($acquired) { $mutex.ReleaseMutex() }
          $mutex.Dispose()
        }
    - if: inputs.pnpm-install == 'true'
      shell: bash
      run: mise x -- pnpm install --frozen-lockfile
