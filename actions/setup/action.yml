name: Setup
description: Installs the tools pinned in mise.toml and the pnpm dependencies from the lockfile.

inputs:
  install_args:
    description: Tools for mise to install, such as "node pnpm". Empty installs each tool in mise.toml.
    default: ""
  pnpm-install:
    description: Set to "false" to skip pnpm install.
    default: "true"

runs:
  using: composite
  steps:
    # A running tool can hold a shim of the machine-wide folder open on the PC runner, and a reshim then fails.
    # $GITHUB_ENV carries the job's own shim folder to every later step, the caller's steps too.
    - shell: bash
      run: echo "MISE_SHIMS_DIR=$RUNNER_TEMP/mise-shims" >> "$GITHUB_ENV"
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        # The tools stay on the dev machine between runs. A cache would upload them to GitHub on each run.
        cache: false
        # Many runner services share one mise folder on the PC, so the steps below install the tools one job at a time.
        install: false
    - name: Install the tools, one job at a time on the PC
      if: runner.os == 'Windows'
      # Windows PowerShell ships with Windows, and pwsh may be missing on the runner.
      shell: powershell
      env:
        MISE_INSTALL_ARGS: ${{ inputs.install_args }}
      run: |
        $mutex = [System.Threading.Mutex]::new($false, 'Global\WorkbenchSoftMiseInstall')
        $acquired = $false
        try {
          try { $acquired = $mutex.WaitOne([TimeSpan]::FromMinutes(30)) }
          catch [System.Threading.AbandonedMutexException] { $acquired = $true }
          if (-not $acquired) { throw 'Timed out waiting for the shared mise install lock' }
          & mise install @($env:MISE_INSTALL_ARGS -split '\s+' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "mise install failed with exit code $LASTEXITCODE" }
        } finally {
          if ($acquired) { $mutex.ReleaseMutex() }
          $mutex.Dispose()
        }
    - name: Install the tools
      if: runner.os != 'Windows'
      shell: bash
      env:
        MISE_INSTALL_ARGS: ${{ inputs.install_args }}
      run: |
        # Word splitting turns "node pnpm" into two tools, and an empty value into none.
        # shellcheck disable=SC2086
        mise install $MISE_INSTALL_ARGS
    - if: inputs.pnpm-install == 'true'
      shell: bash
      run: |
        if [ "$RUNNER_OS" != Windows ]; then
          mise x -- pnpm install --frozen-lockfile
          exit 0
        fi
        # Every hardlink of a file shares it: a delete of one link, such as an old checkout or a dev
        # worktree, fails reads through the others with EBUSY. The runners get a store of their own,
        # C:\ci\_pnpm-store, and copy from it, so no other link to a file they read ever exists.
        store="$(cygpath -w "$(dirname "$(dirname "$RUNNER_WORKSPACE")")")\\_pnpm-store"
        # The later steps of the job run pnpm too, and pnpm refuses a store other than the install's.
        { echo "pnpm_config_store_dir=$store"; echo "pnpm_config_package_import_method=copy"; } >> "$GITHUB_ENV"
        if [ -d node_modules ] && [ ! -e node_modules/.ci-store ]; then
          # The job start hook of local-ci deletes _trash-* folders beside the checkouts.
          trash="$(dirname "$RUNNER_WORKSPACE")/_trash-$(date +%Y%m%d%H%M%S)-node_modules-$(basename "$RUNNER_WORKSPACE")"
          mv node_modules "$trash"
        fi
        pnpm_config_store_dir="$store" pnpm_config_package_import_method=copy mise x -- pnpm install --frozen-lockfile
        touch node_modules/.ci-store
