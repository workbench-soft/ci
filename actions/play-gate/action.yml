name: Play gate
description: Finds the newest release to send to Google Play. The tag output is empty when the run has nothing to send.

inputs:
  tag-prefix:
    description: The start of the app's release tags, such as "v" or "tickalot-v".
    default: v
  release-repo:
    description: The repo that holds the releases, as owner/name. Defaults to this repo.
    default: ""
  hour:
    description: The local hour a schedule run sends at.
    default: "19"
  zone:
    description: The time zone of that hour.
    default: Australia/Sydney
  token:
    description: A token that can read the releases of release-repo.
    default: ${{ github.token }}

outputs:
  tag:
    description: The release tag to build and send, empty when there is none.
    value: ${{ steps.sent.outputs.cache-hit != 'true' && steps.find.outputs.tag || '' }}
  sha:
    description: The commit of that release.
    value: ${{ steps.find.outputs.sha }}

runs:
  using: composite
  steps:
    - id: find
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PREFIX: ${{ inputs.tag-prefix }}
        RELEASE_REPO: ${{ inputs.release-repo || github.repository }}
        HOUR: ${{ inputs.hour }}
        ZONE: ${{ inputs.zone }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { PREFIX, RELEASE_REPO, HOUR, ZONE } = process.env;
          // Each play.yml lists a cron for summer and one for winter. The cron's own hour counts, so a late start still matches.
          if (context.eventName === 'schedule') {
            const at = new Date();
            at.setUTCHours(Number(context.payload.schedule.split(' ')[1]), 0, 0, 0);
            const local = new Intl.DateTimeFormat('en-GB', { timeZone: ZONE, hour: '2-digit', hourCycle: 'h23' }).format(at);
            if (Number(local) !== Number(HOUR)) return core.info(`The cron ${context.payload.schedule} falls at ${local}:00 in ${ZONE}, so this run sends nothing.`);
          }
          const [owner, repo] = RELEASE_REPO.split('/');
          const { data } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
          const release = data.find((item) => !item.draft && !item.prerelease && item.tag_name.startsWith(PREFIX));
          if (!release) return core.info(`${RELEASE_REPO} has no release whose tag starts with ${PREFIX}.`);
          let { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `tags/${release.tag_name}` });
          let { sha, type } = ref.object;
          if (type === 'tag') sha = (await github.rest.git.getTag({ owner, repo, tag_sha: sha })).data.object.sha;
          core.info(`The newest release is ${release.tag_name} at ${sha}.`);
          core.setOutput('tag', release.tag_name);
          core.setOutput('sha', sha);
    # play-mark packs the marker on any runner, so both sides pack with gzip.
    - if: steps.find.outputs.tag != ''
      shell: bash
      run: |
        dir="$RUNNER_TEMP/no-zstd"
        mkdir -p "$dir" play-sent
        printf '#!/bin/sh\nexit 1\n' > "$dir/zstd"
        chmod +x "$dir/zstd"
        printf '@exit /b 1\r\n' > "$dir/zstd.cmd"
        echo "$dir" >> "$GITHUB_PATH"
    - id: sent
      if: steps.find.outputs.tag != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: play-sent
        key: play-sent-${{ steps.find.outputs.tag }}
        lookup-only: true
        enableCrossOsArchive: true
    - if: steps.sent.outputs.cache-hit == 'true'
      shell: bash
      run: echo "Google Play has ${{ steps.find.outputs.tag }} already, so this run sends nothing."
