name: Release

# A push to main whose Lint run passes gets a release, unless a newer push queues behind it: that one covers both.
# The version is the date: 2026.10.30.1, then 2026.10.30.2.
# The release carries notes only, since the repo builds no file to ship.
on:
  workflow_run:
    workflows: [Lint]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # A workflow_run starts on the latest main, which can be newer than the commit Lint tested.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  # Holds the release while an agent session still has a PR open. Dependabot and PRs idle for 6 hours don't hold it.
  gate:
    # A dispatch on a branch other than main is refused, so a feature branch spends no release number.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","local"]') }}
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.open.outputs.go }}
    steps:
      - id: open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,author,updatedAt --jq '[.[] | select((.author.is_bot | not) and (.updatedAt | fromdateiso8601) > now - 21600) | "#" + (.number | tostring)] | join(" ")')
          if [ -n "$open" ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "::notice::Release waits for the open PRs $open"
            echo go=false >> "$GITHUB_OUTPUT"
          else
            echo go=true >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # One release runs at a time, so each sees the tag of the one before. A newer one cancels the stale one.
    # gh release create makes the tag with the release, so a cancel leaves no tag without a release.
    concurrency:
      group: release
      cancel-in-progress: true
    # The PC runner costs 0 minutes on a private repo.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","local"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0

      # A run that failed after its tag push keeps that tag when it runs again.
      - name: Pick the version
        id: version
        run: |
          tag=$(git tag --points-at "$SHA" --list 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*' | head -n 1)
          echo "tag=${tag:-v$(.github/scripts/next-version.sh)}" >> "$GITHUB_OUTPUT"

      # A tag pushed with the workflow token doesn't start other workflows.
      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --target "$SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
