name: Release

# A push to main whose Lint run passes gets a release, unless a newer push queues behind it: that one covers both.
# The version is the date: 2026.10.30.1, then 2026.10.30.2.
# The release carries notes only, since the repo builds no file to ship.
on:
  push:
    branches: [main]
    # Markdown holds no workflow, so a docs-only push skips the lint.
    paths: ["**", "!**.md"]
  # merge-dependabot.yml starts it on main after a Dependabot merge.
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

  SHA: ${{ github.sha }}

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'

    # gh release create makes the tag with the release, so a cancel leaves no tag without a release.
    # The PC runner costs 0 minutes on a private repo.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","local"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0

      # A run that failed after its tag push keeps that tag when it runs again.
      - name: Pick the version
        id: version
        run: |
          tag=$(git tag --points-at "$SHA" --list 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*' | head -n 1)
          echo "tag=${tag:-v$(.github/scripts/next-version.sh)}" >> "$GITHUB_OUTPUT"

      # A tag pushed with the workflow token doesn't start other workflows.
      - name: Wait for matching checks before publication
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_WORKFLOW: lint.yml
        run: bash .github/scripts/wait-for-checks.sh

      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --target "$SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
