name: Dependabot auto-merge

# Merges a Dependabot PR as soon as it opens. PR checks are off, so the checks on main catch a bad update.
# A major update waits for a person, unless the repo sets allow_major.
# A repo calls this from a pull_request_target workflow. That runs from main, so it gets a write token
# although Dependabot opened the PR. It checks out no PR code.
on:
  workflow_call:
    inputs:
      workflows:
        description: Workflow files to run on main after the merge, such as "checks.yml"
        type: string
        required: true
      allow_major:
        description: Merge a major update too
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  merge:
    # A commit a person pushes to a Dependabot branch makes them the actor, so that PR waits for a review.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: [self-hosted, local]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ALLOW_MAJOR: ${{ inputs.allow_major }}
          WORKFLOWS: ${{ inputs.workflows }}
        run: |
          if [ "$UPDATE_TYPE" = version-update:semver-major ] && [ "$ALLOW_MAJOR" != true ]; then
            echo "A major update waits for a person to merge it."
            exit 0
          fi

          gh pr merge "$PR" --squash --delete-branch

          # A merge made with the workflow token starts no push run, so start the checks on main by hand.
          for workflow in $WORKFLOWS; do
            gh workflow run "$workflow" --ref "$BASE"
          done
