name: Dependabot auto-merge

# Merges a Dependabot PR as soon as it opens. PR checks are off, so the checks on main catch a bad update.
# A major update waits for a person, unless the repo sets allow_major.
# A repo calls this from a pull_request_target workflow. That runs from main, so it gets a write token
# although Dependabot opened the PR. It checks out no PR code.
on:
  workflow_call:
    inputs:
      workflows:
        description: Workflow files to run on main after the merge, such as "checks.yml"
        type: string
        required: true
      allow_major:
        description: Merge a major update too
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  merge:
    # A commit a person pushes to a Dependabot branch makes them the actor, so that PR waits for a review.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","local"]') }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ALLOW_MAJOR: ${{ inputs.allow_major }}
          WORKFLOWS: ${{ inputs.workflows }}
        run: |
          if [ "$UPDATE_TYPE" = version-update:semver-major ] && [ "$ALLOW_MAJOR" != true ]; then
            echo "A major update waits for a person to merge it."
            exit 0
          fi

          # A run queued behind an earlier one for the same PR finds it merged, and would start the checks twice.
          state=$(gh pr view "$PR" --json state --jq .state)
          if [ "$state" != OPEN ]; then
            echo "PR #$PR is $state already."
            exit 0
          fi

          # A token merge emits no push, so dispatch the release workflows paired with these checks too.
          workflow_files=$(gh api "repos/$GH_REPO/actions/workflows?per_page=100" --jq '.workflows[] | select(.state == "active" and (.path | startswith(".github/workflows/"))) | .path | sub("^\\.github/workflows/"; "")')
          while IFS= read -r paired_workflow; do
            paired_yaml=$(gh workflow view "$paired_workflow" --ref "$BASE" --yaml)
            if ! grep -Eq '^  push:' <<< "$paired_yaml" || ! grep -q 'wait-for-checks.sh' <<< "$paired_yaml"; then
              continue
            fi
            paired_check=$(sed -nE 's/^[[:space:]]*CHECKS_WORKFLOW:[[:space:]]*([^[:space:]]+).*$/\1/p' <<< "$paired_yaml" | tr -d '\042\047' | head -n 1)
            paired_check=${paired_check:-checks.yml}
            case " $WORKFLOWS " in
              *" $paired_check "*)
                case " $WORKFLOWS " in
                  *" $paired_workflow "*) ;;
                  *) WORKFLOWS="$WORKFLOWS $paired_workflow" ;;
                esac
                ;;
            esac
          done <<< "$workflow_files"

          # A workflow without workflow_dispatch can't start after the merge, and a merge made with the workflow
          # token starts no push run. So the PR stays open until the caller fixes its list.
          for workflow in $WORKFLOWS; do
            if ! gh workflow view "$workflow" --ref "$BASE" --yaml | grep -Eq '^[[:space:]]*workflow_dispatch:'; then
              echo "::error::$workflow is missing on $BASE or has no workflow_dispatch trigger, so it can't run after the merge. Add the trigger, then reopen PR #$PR."
              exit 1
            fi
          done

          gh pr merge "$PR" --squash --delete-branch

          # Checks and their paired release builds start together on the merged branch.
          for workflow in $WORKFLOWS; do
            gh workflow run "$workflow" --ref "$BASE"
          done
