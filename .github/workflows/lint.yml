name: Lint

# Every app repo runs these workflows, so a broken one fails CI there.
on:
  push:
    branches: [main]
    # Markdown holds no workflow, so a docs-only push skips the lint.
    paths: ["**", "!**.md"]
  # merge-dependabot.yml starts it on main after a Dependabot merge.
  workflow_dispatch:
  # PR runs are off: agents run the tests and linter locally before they merge.
  # To run this on PRs again, uncomment the pull_request lines below.
  # pull_request:

# A newer push to the same branch or PR cancels this run on GitHub's side.
# The local-ci page cancels the runs GitHub leaves, such as those of a merged PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The lint only reads the repo.
permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","local"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repo checks its own setup action, so a break shows here before it reaches the app repos.
      - uses: ./actions/setup
        with:
          pnpm-install: "false"
      - run: mise run lint
      - run: mise run test
