name: Lint

# Every app repo runs these workflows, so a broken one fails CI there.
on:
  push:
    branches: [main]
    # Markdown holds no workflow, so a docs-only push skips the lint.
    paths: ["**", "!**.md"]
  # merge-dependabot.yml starts it on main after a Dependabot merge.
  workflow_dispatch:
  # PR runs are off: agents run the tests and linter locally before they merge.
  # To run this on PRs again, uncomment the pull_request lines below.
  # pull_request:

jobs:
  actionlint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","local"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        env:
          MISE_SHIMS_DIR: ${{ runner.temp }}/mise-shims
        with:
          cache: false
      - run: mise run lint
