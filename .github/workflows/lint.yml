name: Lint

# Every app repo runs these workflows, so a broken one fails CI there.
on:
  push:
    branches: [main]
    # Markdown holds no workflow, so a docs-only push skips the lint.
    paths: ["**", "!**.md"]
  # PR runs are off: agents run the tests and linter locally before they merge.
  # To run this on PRs again, uncomment the pull_request lines below.
  # pull_request:

jobs:
  actionlint:
    runs-on: [self-hosted, local]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
      - run: mise run lint
