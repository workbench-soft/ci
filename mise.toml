[tools]
actionlint = "1.7.12"
"npm:markdownlint-cli2" = "0.24.0"
"npm:oxfmt" = "0.75.0"
# actionlint checks the run scripts with shellcheck only when it finds one on PATH.
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "Check the workflows, the scripts and the format of every file"
run = [
  "markdownlint-cli2",
  "actionlint",
  "sh -c 'shellcheck .github/scripts/*.sh'",
  "shfmt -i 2 -ci -d .github/scripts",
  "oxfmt --check",
]

[tasks.format]
description = "Format the scripts and every other file"
run = ["shfmt -i 2 -ci -w .github/scripts", "oxfmt"]

[tasks.test]
description = "Check the release scripts against a throwaway git repo"
run = "sh .github/scripts/test-release.sh"
